id: passwords_and_mfa
title: One Password, Everywhere
title_translations: { hi-IN: "एक password, हर जगह" }
topic: passwords
summary: Leo's one-password system meets a sign-in request he didn't start.
headline: Long, unique, and backed by a second step
headline_translations: { hi-IN: "लंबा, अलग, और दूसरे step के साथ" }
setting: { backdrop: office, time_of_day: day }
lines:
  - id: pw_01
    who: leo
    say: "I have a system. One really good password, and I use it for everything."
    translations: { hi-IN: "मेरा एक system है। एक बहुत बढ़िया password, और वही हर जगह।" }
  - id: pw_02
    who: nadia
    say: "So one leaky website, and they have everything."
    translations: { hi-IN: "यानी एक website leak हुई, और उनके पास सब कुछ।" }
  - id: pw_03
    who: leo
    say: "When you say it out loud, it sounds worse."
    translations: { hi-IN: "ज़ोर से बोलो तो और बुरा लगता है।" }
  - id: pw_04
    who: mira
    say: "Websites get breached all the time. Then attackers try the same email and password everywhere else."
    translations: { hi-IN: "Websites से data चोरी होता रहता है। फिर हमलावर वही email और password हर दूसरी जगह आज़माते हैं।" }
  - id: pw_05
    who: mira
    say: "Use a different password for every account. A long phrase of a few random words is easier to remember, and harder to guess, than a short jumble."
    translations: { hi-IN: "हर account का password अलग रखिए। कुछ बेतरतीब शब्दों का लंबा phrase याद रखना आसान है, और guess करना मुश्किल।" }
  - id: pw_06
    who: mira
    say: "And let a password manager remember them, if {org.it_team} provides one."
    translations: { hi-IN: "और अगर {org.it_team} password manager देती है, तो याद रखने का काम उसे दीजिए।" }
  - id: pw_07
    card: { text: "New sign-in request. Approve?", translations: { hi-IN: "नया sign-in request. Approve करें?" }, seconds: 2.5 }
  - id: pw_08
    who: leo
    say: "Oh, a sign-in request. I'll just tap approve. It's probably me."
    translations: { hi-IN: "अरे, sign-in request। Approve दबा देता हूँ, शायद मैं ही हूँ।" }
  - id: pw_09
    who: nadia
    say: "Are you signing in right now?"
    translations: { hi-IN: "क्या तुम अभी sign in कर रहे हो?" }
  - id: pw_10
    who: leo
    say: "I'm standing in a corridor holding a muffin."
    translations: { hi-IN: "मैं corridor में muffin लेकर खड़ा हूँ।" }
  - id: pw_11
    who: mira
    say: "Then it isn't you. Someone may already have your password. Deny it, and tell {org.security_team} straight away."
    translations: { hi-IN: "तो ये आप नहीं हैं। हो सकता है किसी के पास आपका password पहले से हो। Deny कीजिए, और तुरंत {org.security_team} को बताइए।" }
  - id: pw_12
    who: mira
    say: "That second step is what saved you. Keep it switched on wherever you can."
    translations: { hi-IN: "इसी दूसरे step ने आपको बचाया। जहाँ भी हो सके, इसे चालू रखिए।" }
takeaway: "Use a long, different password for every account. Turn on two-step sign-in, and never approve a request you didn't start."
takeaway_translations: { hi-IN: "हर account के लिए लंबा, अलग password रखिए। दो-step sign-in चालू रखिए, और जो request आपने शुरू नहीं की, उसे कभी approve मत कीजिए।" }
