# Clayvoyant project file: five scams that reach people in India, as five short scenes in English and Hindi.
# For families, schools, colleges, housing societies, bank branches and community groups.
# Every scene's advice follows a public advisory (I4C, RBI, DoT); each scene's policy_note names it, and
# docs/INDIA.md links them. Check them again before you show the film: helplines and portals can change.
#
#   sastudio validate .                      check your edits
#   sastudio film . --preset draft           clay stop motion (needs Blender and the free voice)
#   sastudio film . --lang hi-IN             the Hindi film
#   sastudio render . --preset draft         drawn characters instead: no Blender, no graphics card
schema_version: 1

project:
  title: "Not So Fast"
  subtitle: "Five scams, five minutes, five ways to stop them"
  language: en-IN
  languages: [en-IN, hi-IN]
  labels:
    topics:
      "digital arrest": { hi-IN: "डिजिटल अरेस्ट" }
      "UPI PIN": { hi-IN: "यूपीआई पिन" }
      "OTP": { hi-IN: "ओटीपी" }
      "fake app": { hi-IN: "नकली ऐप" }
      "fake helpline": { hi-IN: "नकली हेल्पलाइन" }
  credits:
    show: true
    # creator: "Your name, school or association"
    extra:
      - "The people are invented. The helplines and portals are real: 1930, cybercrime.gov.in, sancharsaathi.gov.in."

organization:
  # Who is showing this film. Replace these with your school, society, branch or group.
  name: "Example Residents' Association"
  short_name: "Example RWA"
  security_email: "help@example.com"                  # where your own people can ask for help
  reporting_url: "https://cybercrime.gov.in"          # the national cyber crime reporting portal
  # translations:                                     # your name as the Hindi film should show it
  #   hi-IN: { name: "...", short_name: "..." }

characters:
  - id: gopal
    name: Gopal
    role: Retired schoolteacher
    description: Courteous, proud, believes anyone who speaks with authority.
    pronouns: he
    gender: masculine
    forms: { full_name: "Gopal Rao", hi-IN.name: "गोपाल" }
    spoken: { hi-IN: "गोपाल" }
    voice:
      provider: kokoro
      speaker: bm_george
      settings: { speed: 0.92 }
      languages: { hi-IN: { provider: kokoro, speaker: hm_omega, settings: { speed: 0.92 } } }
    look:
      style: clay
      design:
        skin: "#9A6845"
        eyes: "#24160E"
        hair: { style: short, color: "#BDB8B0" }
        outfit: { style: vest, color: "#7B5A3A", shirt: "#ECE5D4" }
        trousers: "#6E6457"
        shoes: { style: flat, color: "#4A3424" }
        extras: [glasses, moustache]
        body: { build: average, height: short }
