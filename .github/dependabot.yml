version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # uv understands uv.lock; the pip ecosystem would update pyproject.toml only and leave the
  # lock stale, so every pull request would fail `uv sync --frozen` in CI.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
