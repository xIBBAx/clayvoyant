scenes:
  - file: scenes/01_the_call.yaml
  - file: scenes/02_pin_is_for_paying.yaml
  - file: scenes/03_six_numbers.yaml
  - file: scenes/04_the_light_bill.yaml
  - file: scenes/05_the_first_number.yaml

voices:
  providers:
    offline: { engine: auto }        # used by --voice-fallback offline when the free neural voice is not installed
  budget:
    max_characters: 0

speech:
  gap_seconds: 0.4
  lexicon:
    Gopal: { default: "Go paal" }
    CBI: { default: "C B I" }
    UPI: { default: "U P I" }
    OTP: { default: "O T P" }
    KYC: { default: "K Y C" }

render:
  preset: draft
  renderer: cards          # `sastudio render`: drawn characters, no Blender. `sastudio film` is always clay.
  # character_style: v2    # v1 sketch, v2 flat, v3 cutout: drawn characters that talk and blink; v4 clay portraits (default)
  output: build
  burn_subtitles: true
  intro: true
  outro: true
