name: Release

# A maintainer pushes a version tag (vX.Y.Z, or a pre-release such as v0.2.0rc1 / v0.2.0-rc.1).
# This workflow tests, builds the wheel and sdist, writes SHA256SUMS and creates a DRAFT GitHub
# release. Nothing is public until a maintainer reviews the draft and publishes it. PyPI upload is
# a separate, manual workflow (publish-pypi.yml).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest

      - name: Check the tag matches the package version
        run: |
          # Compare PEP 440 normal forms, so v0.2.0-rc.1 and v0.2.0rc1 both match __version__ 0.2.0rc1.
          VERSION="$(uv run python -c 'import sastudio; from packaging.version import Version; print(Version(sastudio.__version__))')"
          TAG_VERSION="$(uv run python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "${GITHUB_REF_NAME#v}")"
          test "${TAG_VERSION}" = "${VERSION}" || { echo "Tag ${GITHUB_REF_NAME} (${TAG_VERSION}) != version ${VERSION}"; exit 1; }
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || { echo "Missing docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }

      - name: Build
        run: |
          uv build --out-dir dist
          uvx twine@7.0.0 check dist/*
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  draft-release:
    name: Create draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the draft release and upload its files; only this job can write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          PRE=""
          case "${TAG#v}" in *[a-z]*) PRE="--prerelease" ;; esac   # a, b, rc, dev: mark as pre-release
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --draft --verify-tag $PRE \
            --title "Security Awareness Studio $TAG" --notes-file "docs/releases/$TAG.md"
