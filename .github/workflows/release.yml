name: Release

# A maintainer pushes a version tag (vX.Y.Z, or a pre-release such as v0.2.0rc1 / v0.2.0-rc.1).
# This workflow tests, checks the tag against the package version, builds the wheel and sdist and
# writes SHA256SUMS, then keeps them as the run's `dist` artifact. It never creates or changes a
# release: the maintainer creates the release under their own name from these files (see
# CONTRIBUTING.md, "Releasing"). It has read-only permissions. PyPI upload is a separate, manual
# workflow (publish-pypi.yml).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Test
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run pytest

      - name: Check the tag matches the package version
        run: |
          # Compare PEP 440 normal forms, so v0.2.0-rc.1 and v0.2.0rc1 both match __version__ 0.2.0rc1.
          VERSION="$(uv run python -c 'import sastudio; from packaging.version import Version; print(Version(sastudio.__version__))')"
          TAG_VERSION="$(uv run python -c 'import sys; from packaging.version import Version; print(Version(sys.argv[1]))' "${GITHUB_REF_NAME#v}")"
          test "${TAG_VERSION}" = "${VERSION}" || { echo "Tag ${GITHUB_REF_NAME} (${TAG_VERSION}) != version ${VERSION}"; exit 1; }
          test -f "docs/releases/${GITHUB_REF_NAME}.md" || { echo "Missing docs/releases/${GITHUB_REF_NAME}.md"; exit 1; }

      - name: Build
        run: |
          uv build --out-dir dist
          uvx twine@7.0.0 check dist/*
          (cd dist && sha256sum -- *.whl *.tar.gz > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Next step for the maintainer
        run: |
          echo "Packages built and checked. Create the release under your own name:"
          echo "  gh run download ${GITHUB_RUN_ID} -n dist -D dist"
          echo "  gh release create ${GITHUB_REF_NAME} dist/* --verify-tag --notes-file docs/releases/${GITHUB_REF_NAME}.md"
